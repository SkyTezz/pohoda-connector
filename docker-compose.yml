services:
  pohoda-connector:
    build: .
    image: pohoda-connector:latest
    restart: unless-stopped
    env_file: .env
    environment:
      CONNECTOR_TRANSPORT: http
      CONNECTOR_HTTP_HOST: 0.0.0.0
      CONNECTOR_HTTP_PORT: "8444"
    ports:
      - "127.0.0.1:8444:8444"
    volumes:
      - connector-data:/data
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "20"

volumes:
  connector-data:
