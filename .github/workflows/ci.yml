name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} typecheck + tests + build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Boot smoke (stdio, no POHODA needed for config parsing)
        run: |
          set -euo pipefail
          # A missing POHODA_URL must fail loudly, not hang.
          if node dist/index.js </dev/null 2>err.log; then echo "expected startup failure"; exit 1; fi
          grep -q "Missing required environment variable: POHODA_URL" err.log
